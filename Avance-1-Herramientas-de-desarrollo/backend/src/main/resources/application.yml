spring:
  application:
    name: sabor-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sabor_db}
    username: ${DB_USERNAME:sabor_user}
    password: ${DB_PASSWORD:sabor_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 50
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
