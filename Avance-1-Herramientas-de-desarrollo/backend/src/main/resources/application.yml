spring:
  application:
    name: sabor-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sabor_db}
    username: ${DB_USERNAME:sabor_user}
    password: ${DB_PASSWORD:sabor_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 50
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  cors:
    # Lista separada por comas. En AWS: la URL del sitio web del bucket S3 del frontend.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    # Obligatorias: el backend no arranca sin ellas.
    jwt-secret: ${JWT_SECRET}
    admin-username: ${ADMIN_USERNAME:admin}
    admin-password: ${ADMIN_PASSWORD}
    token-hours: ${JWT_EXPIRATION_HOURS:8}
  s3:
    # Si S3_BUCKET está vacío, la carga de imágenes desde el panel se desactiva
    # (las URLs de imágenes subidas a mano siguen funcionando).
    bucket: ${S3_BUCKET:}
    region: ${AWS_REGION:us-east-1}
    public-base-url: ${S3_PUBLIC_BASE_URL:}
