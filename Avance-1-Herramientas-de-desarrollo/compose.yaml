services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sabor_db
      POSTGRES_USER: sabor_user
      POSTGRES_PASSWORD: sabor_password
    ports:
      - "5432:5432"
    volumes:
      - sabor_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sabor_user -d sabor_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/sabor_db
      DB_USERNAME: sabor_user
      DB_PASSWORD: sabor_password
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080/api
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  sabor_postgres_data:
